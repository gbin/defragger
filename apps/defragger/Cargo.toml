[package]
name = "defragger"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
defrag-domain = { path = "../../crates/defrag-domain" }
defrag-service = { path = "../../crates/defrag-service" }
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
